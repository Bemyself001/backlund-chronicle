<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1112" />
    <meta name="description" content="《贝克兰德纪事》——在煤烟与神秘交织的鲁恩首都，创建原创角色并展开单人 AI 文字冒险。" />
    <link rel="preload" href="/assets/promo-9x16-720.webp" as="image" type="image/webp" media="(max-width: 600px)" fetchpriority="high" />
    <link rel="preload" href="/assets/promo-16x9-1600.webp" as="image" type="image/webp" media="(min-width: 601px)" fetchpriority="high" />
    <link rel="preload" href="/fonts/ShanHaiXingYeGeTeW-2.woff2?v=20260909-mobile" as="font" type="font/woff2" crossorigin />
    <title>贝克兰德纪事 · AI 文字沙盒</title>
    <!-- STARTUP_DIAGNOSTICS -->
  </head>
  <body>
    <section id="startup-panel" aria-labelledby="startup-title">
      <div id="startup-sheet">
      <header id="startup-toolbar"><div><p id="startup-eyebrow">贝克兰德 · 设备检测</p><h1 id="startup-title">正在打开贝克兰德纪事</h1></div></header>
      <p id="startup-message">正在加载游戏，请稍候。若启动未完成，这里将显示诊断信息。</p>
      <section id="input-diagnostics" hidden>
        <h2>输入检测</h2>
        <p>依次点击两个输入框，输入或粘贴 abc，比较是否都能正常编辑。</p>
        <div id="input-probes">
        <label>普通输入框<input id="input-probe-plain" type="text" autocomplete="off" /></label>
        <div id="input-probe-react"></div>
        </div>
        <p id="input-status">测试文字不会保存，也不会进入报告。</p>
        <button id="input-reset" type="button">清空检测记录</button>
      </section>
      <details id="startup-details"><summary>查看诊断详情</summary>
        <p>报告仅含环境、启动阶段、错误类型、输入事件与字符数，不包含输入文字、密钥或存档。</p>
        <textarea id="startup-report" readonly aria-label="启动诊断信息"></textarea>
      </details>
      <div id="startup-actions">
      <button id="startup-copy" type="button">复制诊断信息</button>
      <button id="startup-retry" type="button" hidden>重新启动</button>
      </div>
      <noscript>当前环境未启用 JavaScript，游戏无法启动。</noscript>
      </div>
    </section>
    <script>if (window.__startupDiagnostics) window.__startupDiagnostics.bind();</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
