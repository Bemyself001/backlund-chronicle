name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app and sync Android
        run: pnpm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare public APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk backlund-chronicle-debug.apk
          sha256sum backlund-chronicle-debug.apk > backlund-chronicle-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: backlund-chronicle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" \
            backlund-chronicle-debug.apk \
            backlund-chronicle-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "贝克兰德纪事 APK · Build ${GITHUB_RUN_NUMBER}" \
            --notes "自动构建的 Android 调试版。下载 APK 后可直接安装；Android 可能提示允许安装未知来源应用。" \
            --latest
