name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  PRODUCT_VERSION: "1.4.1"

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard against stale product version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只有 tag 确实存在（API 成功）才比较；404 表示未发布，直接放行
          if EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/v$PRODUCT_VERSION" --jq '.object.sha' 2>/dev/null); then
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::版本 v$PRODUCT_VERSION 已发布（指向 $EXISTING），请先递增 PRODUCT_VERSION（.github/workflows/build-android-apk.yml 与 src/data/release.js）再推送。"
              exit 1
            fi
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release version and signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/backlund-release.jks"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "APP_VERSION_NAME=$PRODUCT_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((30000 + COMMIT_COUNT))" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$PRODUCT_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/backlund-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build web app and sync Android
        env:
          VITE_APP_BUILD: ${{ github.sha }}
        run: pnpm run android:sync

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Prepare public APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk backlund-chronicle.apk
          sha256sum backlund-chronicle.apk > backlund-chronicle.apk.sha256

      - name: Prepare OTA web bundle
        run: |
          test -f dist/client/index.html
          test -f dist/client/bundle-manifest.json
          cd dist/client && zip -qr ../../web-bundle-v2.zip . && cd ../..
          sha256sum web-bundle-v2.zip > web-bundle-v2.zip.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: backlund-chronicle-${{ env.APP_VERSION_NAME }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${APP_VERSION_NAME}"
          gh release create "$RELEASE_TAG" \
            backlund-chronicle.apk \
            backlund-chronicle.apk.sha256 \
            web-bundle-v2.zip \
            web-bundle-v2.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "贝克兰德纪事 ${PRODUCT_VERSION}" \
            --notes "1.4.1 · 22条神之途径完整名录：内容包补全全部22条神之途径，每条登记序列9至序列0的完整称号阶梯（称号依据原著设定核对）；开局创建的序列9途径选项由12条扩展为全部22条，新增偷盗者、刺客、仲裁人、律师、囚犯、罪犯、耕种者、药师、怪物、秘祈人10条途径，各配序列9初始能力；原有存档与晋升数据不受影响。请下载 backlund-chronicle.apk 直接覆盖安装以保留存档，不要先卸载。" \
            --latest
