name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release version and signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/backlund-release.jks"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "APP_VERSION_NAME=1.2.${COMMIT_COUNT}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((20000 + COMMIT_COUNT))" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=1.2.${COMMIT_COUNT}" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/backlund-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build web app and sync Android
        run: pnpm run android:sync

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare public APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk backlund-chronicle.apk
          sha256sum backlund-chronicle.apk > backlund-chronicle.apk.sha256

      - name: Prepare OTA web bundle
        run: |
          test -f dist/client/index.html
          cd dist/client && zip -qr ../../web-bundle.zip . && cd ../..
          sha256sum web-bundle.zip > web-bundle.zip.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: backlund-chronicle-${{ env.APP_VERSION_NAME }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${APP_VERSION_NAME}"
          gh release create "$RELEASE_TAG" \
            backlund-chronicle.apk \
            backlund-chronicle.apk.sha256 \
            web-bundle.zip \
            web-bundle.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "贝克兰德纪事 ${APP_VERSION_NAME}" \
            --notes "正式签名的 Android 版本。已安装 1.1.66 及以上底座的设备将通过热更新获取后续版本（约 0.2 MB，免重装）；首次从旧版迁移请安装本 APK，安装前请导出存档并卸载旧版。" \
            --latest
