name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build Android APK]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm run lint

      - name: Build standalone site
        env:
          VITE_APP_BUILD: ${{ github.sha }}
        run: pnpm run build

      - name: Prepare Pages artifact
        run: |
          mkdir pages
          cp "dist/贝克兰德纪事-离线版.html" pages/index.html
          cp dist/privacy.html pages/privacy.html
          cp -R dist/client/assets pages/assets
          mkdir -p pages/fonts
          cp dist/fonts/ShanHaiXingYeGeTeW-2.woff2 pages/fonts/
          cd dist/client && zip -qr ../../pages/web-bundle.zip . && cd ../..
          sha256sum pages/web-bundle.zip | awk '{print $1}' > /tmp/web-bundle.sha256

      - name: Write update manifest (latest.json)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > /tmp/release.json || echo '{}' > /tmp/release.json
          node -e '
            const fs = require("fs");
            const release = JSON.parse(fs.readFileSync("/tmp/release.json", "utf8"));
            const assets = release.assets || [];
            const apk = assets.find((a) => a.name === "backlund-chronicle.apk") || assets.find((a) => a.name && a.name.endsWith(".apk"));
            const releaseVersion = String(release.tag_name || "").replace(/^v/i, "");
            const releaseMatchesBuild = release.target_commitish === process.env.GITHUB_SHA;
            const manifest = {
              // Pages 可能先于 APK 构建完成；只发布已存在 Release 的版本，避免新版号指向旧安装包。
              version: releaseVersion,
              apkUrl: apk ? apk.browser_download_url : null,
              bundleUrl: releaseMatchesBuild ? "https://bemyself001.github.io/backlund-chronicle/web-bundle.zip" : null,
              bundleSha256: releaseMatchesBuild ? fs.readFileSync("/tmp/web-bundle.sha256", "utf8").trim() : null,
              releaseUrl: release.html_url || null,
              notes: release.body || "",
              publishedAt: new Date().toISOString(),
            };
            fs.writeFileSync("pages/latest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
