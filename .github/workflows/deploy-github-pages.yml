name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build Android APK]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm run lint

      - name: Build standalone site
        env:
          VITE_APP_BUILD: ${{ github.sha }}
        run: pnpm run build

      - name: Prepare Pages artifact
        run: |
          mkdir pages
          cp "dist/贝克兰德纪事-离线版.html" pages/index.html
          cp dist/privacy.html pages/privacy.html
          cp -R dist/client/assets pages/assets
          mkdir -p pages/fonts
          cp dist/fonts/ShanHaiXingYeGeTeW-2.woff2 pages/fonts/

      - name: Write update manifest (latest.json)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > /tmp/release.json
          RELEASE_TAG=$(jq -r '.tag_name' /tmp/release.json)
          RELEASE_VERSION="${RELEASE_TAG#v}"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if jq -e '.assets[] | select(.name == "web-bundle-v2.zip")' /tmp/release.json > /dev/null; then
            mkdir -p "pages/ota/$RELEASE_VERSION"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'web-bundle-v2.zip*' --dir "pages/ota/$RELEASE_VERSION"
          fi
          node scripts/write-update-manifests.mjs /tmp/release.json pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
