apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseSigning = releaseStoreFile && System.getenv('ANDROID_KEYSTORE_PASSWORD') && System.getenv('ANDROID_KEY_ALIAS') && System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'io.github.bemyself001.backlundchronicle.nativeui'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.bemyself001.backlundchronicle'
        minSdk 24
        targetSdk 36
        versionCode (System.getenv('APP_VERSION_CODE') ?: '30163').toInteger()
        versionName (System.getenv('NATIVE_VERSION_NAME') ?: '1.8.0-native.1')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // The preview can coexist with the released game during save migration testing.
    flavorDimensions 'channel'
    productFlavors {
        preview { dimension 'channel'; applicationIdSuffix '.native'; resValue 'string', 'app_name', '贝克兰德纪事 · 原生版' }
        production { dimension 'channel'; resValue 'string', 'app_name', '贝克兰德纪事' }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
    packaging { resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'app.cash.zipline:zipline-android:1.27.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'app.cash.zipline:zipline-jvm:1.27.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

// JVM tests must use a host library, never the Android .so.
configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('app.cash.zipline:zipline-android') using module('app.cash.zipline:zipline-jvm:1.27.0')
    }
}

tasks.named('preBuild').configure {
    doFirst {
        if (!file('src/main/assets/engine.js').isFile()) throw new GradleException('Run node scripts/build-native-engine.mjs before building native Android')
    }
}
